name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build kv_module (nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v24
        with:
          accept-flake-config: true

      - name: Override logos-module-builder input
        run: |
          nix build --override-input logos-module-builder github:logos-co/logos-module-builder .#kv_module --print-build-logs

  flake-check:
    name: Flake metadata check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v24
        with:
          accept-flake-config: true

      - name: Check flake eval
        run: |
          nix flake --override-input logos-module-builder github:logos-co/logos-module-builder metadata --json
