name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build kv_module (nix)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ secrets.GITHUB_TOKEN }}

      - name: Build kv_module
        run: nix build -L --override-input logos-module-builder github:logos-co/logos-module-builder .

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: kv-module-plugin
          path: result/
